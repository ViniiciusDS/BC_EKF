name: Dataset 2026 regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/odometry/**"
      - "src/analysis/field_diagnostic.py"
      - "src/analysis/field_lap_metrics.py"
      - "src/analysis/uwb_link_quality.py"
      - "src/uwb/preprocessing.py"
      - "src/uwb/preprocessing_workflow.py"
      - "src/fusion/**"
      - "src/bc_ekf.py"
      - "src/ui/algo_modes/dataset_bc_prep.py"
      - "tests/test_two_tag_geometry_2026.py"
      - "src/ui/algo_modes/dataset_two_tag2026_pipeline.py"
      - "tests/test_dual_tag_pcnt2026.py"
      - "src/ui/algo_modes/dataset_single_tag_fusion.py"
      - "tests/test_single_tag_range_ekf_2026.py"
      - "src/ui/algo_modes/preprocessing_modal.py"
      - "tests/test_uwb_preprocessing_workflow_2026.py"
      - "src/uwb/algoritmos_estaticos.py"
      - "tests/test_uwb_preprocessing_2026.py"
      - "tests/test_uwb_link_quality_2026.py"
      - "tools/audit_uwb_links_2026.py"
      - "tests/test_field_diagnostic.py"
      - "src/ui/algo_modes/dataset_*"
      - "src/ui/algo_modes/shared.py"
      - "src/ui/algo_test_screen.py"
      - "src/ui/botton.py"
      - "apps/main_interactive.py"
      - "tests/test_ui_menu_default_algos_2026.py"
      - "tests/test_dataset_*.py"
      - "tests/test_pcntlog_adapter.py"
      - "tests/test_assisted_encoder_calibration.py"
      - "tests/test_field_odometry_hypotheses.py"
      - "tests/test_field_calibration_audit_2026.py"
      - "tools/audit_field_odometry_2026.py"
      - "tools/compare_field_odometry_2026.py"
      - "tools/check_encoder_calibration_2026.py"
      - "tools/create_robot2026_field_variant.py"
      - ".github/workflows/dataset-2026-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lightweight dependencies
        run: python -m pip install numpy
      - name: Run 2026 data pipeline tests
        run: |
          python -m unittest discover -s tests -p "test_pcntlog_adapter.py" -v
          python -m unittest discover -s tests -p "test_dataset_odometry_pipeline.py" -v
          python -m unittest discover -s tests -p "test_dataset_lap_view.py" -v
          python -m unittest discover -s tests -p "test_dataset_start_gate_2026.py" -v
          python -m unittest discover -s tests -p "test_dataset_track_reference.py" -v
          python -m unittest discover -s tests -p "test_dataset_uwb2026_pipeline.py" -v
          python -m unittest discover -s tests -p "test_robot2026_field_readiness.py" -v
          python -m unittest discover -s tests -p "test_field_passeio_2026.py" -v
          python -m unittest discover -s tests -p "test_dataset_field_analyzer.py" -v
          python -m unittest discover -s tests -p "test_field_diagnostic.py" -v
          python -m unittest discover -s tests -p "test_assisted_encoder_calibration.py" -v
          python -m unittest discover -s tests -p "test_field_odometry_hypotheses.py" -v
          python -m unittest discover -s tests -p "test_dataset_field_lap_metrics.py" -v
          python -m unittest discover -s tests -p "test_field_calibration_audit_2026.py" -v
          python -m unittest discover -s tests -p "test_uwb_link_quality_2026.py" -v
          python -m unittest discover -s tests -p "test_uwb_preprocessing_2026.py" -v
          python -m unittest discover -s tests -p "test_uwb_preprocessing_workflow_2026.py" -v
          python -m unittest discover -s tests -p "test_single_tag_range_ekf_2026.py" -v
          python -m unittest discover -s tests -p "test_two_tag_geometry_2026.py" -v
          python -m unittest discover -s tests -p "test_dual_tag_pcnt2026.py" -v
          python -m unittest discover -s tests -p "test_ui_menu_default_algos_2026.py" -v
          python -m compileall -q apps/main_interactive.py src/ui/algo_test_screen.py src/ui/botton.py src/odometry src/ui/algo_modes src/analysis/field_diagnostic.py src/analysis/uwb_link_quality.py src/uwb/preprocessing.py src/uwb/preprocessing_workflow.py src/fusion src/bc_ekf.py src/uwb/algoritmos_estaticos.py src/ui/algo_modes/preprocessing_modal.py tools
